
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #030303;
            color: #00ff66;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .glow-green {
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.7), 0 0 20px rgba(0, 255, 102, 0.5);
        }
        .glow-red {
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.9), 0 0 30px rgba(255, 0, 0, 0.7);
        }
        .terminal-border-green {
            border: 2px solid #00ff66;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.2), 0 0 15px rgba(0, 255, 102, 0.2);
        }
        .terminal-border-red {
            border: 2px solid #ff0000;
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.3), 0 0 25px rgba(255, 0, 0, 0.4);
        }
        
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
        }
        .cursor::after {
            content: '_';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg); }
            40% { transform: translate(-5px, -5px); filter: invert(1); }
            60% { transform: translate(5px, 5px); filter: hue-rotate(180deg); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }
        .glitch-active {
            animation: glitch-anim 0.2s infinite;
            border-color: #ff0055 !important;
            color: #ff0055 !important;
            background-color: #1a0005 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative transition-colors duration-500" id="bodyTheme">

    <div class="absolute inset-0 scanlines z-50 pointer-events-none"></div>

    <div id="gameContainer" class="w-full max-w-4xl min-h-[480px] p-8 rounded-lg terminal-border-green flex flex-col justify-between relative bg-black/90 transition-all duration-500">
        
        <div class="absolute top-4 left-4 text-sm opacity-70 tracking-widest">&lt; ? &gt;</div>
        <div class="absolute top-4 right-4 text-sm opacity-70 tracking-widest">&lt; ? &gt;</div>
        <div class="absolute bottom-4 left-4 text-sm opacity-70 tracking-widest">&lt; ? &gt;</div>
        <div class="absolute bottom-4 right-4 text-sm opacity-70 tracking-widest">&lt; ? &gt;</div>

        <div class="flex-grow flex flex-col items-center justify-center text-center my-auto space-y-6">
            
            <div id="textOutput" class="text-xl md:text-2xl glow-green leading-relaxed min-h-[120px] flex items-center justify-center px-4 whitespace-pre-line">
                <span id="typedText" class="cursor"></span>
            </div>

            <div id="inputArea" class="w-full max-w-md hidden flex-col items-center space-y-4">
                <div class="relative w-full">
                    <input type="text" id="userInput" autofocus autocomplete="off"
                        class="w-full bg-transparent border-b-2 border-emerald-500 text-center text-2xl text-emerald-400 focus:outline-none focus:border-emerald-300 pb-2 glow-green tracking-wider uppercase"
                        placeholder="...">
                </div>
                <button id="submitBtn" onclick="handleUserSubmit()" 
                    class="px-6 py-2 border border-emerald-500 hover:bg-emerald-500 hover:text-black transition-all duration-300 rounded font-bold tracking-widest uppercase cursor-pointer">
                    Transmit
                </button>
            </div>

            <div id="choiceArea" class="hidden flex space-x-6">
                <button onclick="handleChoice('yes')" class="px-8 py-3 border border-emerald-500 hover:bg-emerald-500 hover:text-black transition-all duration-300 rounded font-bold tracking-widest uppercase cursor-pointer">
                    YES
                </button>
                <button onclick="handleChoice('no')" class="px-8 py-3 border border-emerald-500 hover:bg-red-600 hover:text-white transition-all duration-300 rounded font-bold tracking-widest uppercase cursor-pointer">
                    NO
                </button>
            </div>

        </div>
    </div>

    <div id="bombModal" class="fixed inset-0 bg-black/95 z-[100] hidden flex flex-col items-center justify-center p-4">
        <div class="text-red-600 text-3xl md:text-5xl font-bold glow-red mb-6 animate-pulse text-center">
            CRUOR EST IN MANU TUA
        </div>
        <div class="w-full max-w-3xl aspect-video relative border-4 border-red-600 rounded-lg overflow-hidden shadow-[0_0_50px_rgba(255,0,0,0.8)] bg-black flex items-center justify-center">
            <video id="explosionVideo" class="w-full h-full object-cover" muted playsinline>
                Your browser does not support the video tag.
            </video>
            <div id="videoFallback" class="absolute inset-0 bg-red-950/80 flex flex-col items-center justify-center text-red-300 font-bold text-xl hidden">
                💥 BOMB DETONATED 💥
            </div>
        </div>
        <div class="text-red-400 text-sm mt-6 tracking-widest animate-bounce">
            You failed to grow the rot
        </div>
    </div>

    <script>
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        
        function playKeySound() {
            try {
                let ctx = getAudioContext();
                let osc = ctx.createOscillator();
                let gainNode = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(750, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.025);
                
                gainNode.gain.setValueAtTime(0.025, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.025);
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.025);
            } catch (e) {}
        }

        
        function playBombBeep() {
            try {
                let ctx = getAudioContext();
                let osc = ctx.createOscillator();
                let gainNode = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, ctx.currentTime); 
                osc.frequency.setValueAtTime(440, ctx.currentTime + 0.1);

                gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);

                osc.connect(gainNode);
                gainNode.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {}
        }

        let isTyping = false;
        let riddleIndex = 0;

        const riddles = [
            {
                q: "I hold up the rich, but I bleed on the poor. I stand tall in the shadows, but I'm rotten at the core. What am I?",
                answer: "gotham",
                successMsg: "Correct!\n                                 Park Row alley",
                video: "assets/explosion1.mp4"
            },
            {
                q: "I thrive in the dark, I have wings that don't fly, and I drink from the veins of the city. What am I?",
                answer: "bat",
                successMsg: "Good\n                                  Mountain Drive",
                video: "assets/explosion2.mp4"
            },
            {
                q: "The more you save, I heavier they weigh. I cost you no money, yet I take everything away. What am I?",
                answer: "secret",
                successMsg: "hmmm\n                                       Little Italy",
                video: "assets/explosion3.mp4"
            },
            {
                q: "Thousands walk across my spine every single day, yet I never take a step. I span the water, but I'm always weeping. What am I?",
                answer: "bridge",
                successMsg: "Bravo CaPed cRusaDer\n                          We'll meet again                          soon",
                video: "assets/explosion4.mp4"
            }
        ];

        function typeWriter(text, i = 0, callback) {
            isTyping = true;
            if (i === 0) {
                document.getElementById("typedText").innerHTML = "";
            }
            if (i < text.length) {
                document.getElementById("typedText").innerHTML += text.charAt(i);
                if (text.charAt(i) !== ' ' && text.charAt(i) !== '\n') {
                    playKeySound();
                }
                setTimeout(() => typeWriter(text, i + 1, callback), 35);
            } else {
                isTyping = false;
                if (callback) callback();
            }
        }

        function deleteText(callback) {
            let el = document.getElementById("typedText");
            let text = el.innerHTML;
            if (text.length > 0) {
                el.innerHTML = text.substring(0, text.length - 1);
                setTimeout(() => deleteText(callback), 20);
            } else {
                if (callback) callback();
            }
        }

        window.onload = function() {
            runIntroSequence();
        };

        function runIntroSequence() {
            typeWriter("Hello vengeance", 0, () => {
                setTimeout(() => {
                    deleteText(() => {
                        typeWriter("I was expecting you'd realise soon", 0, () => {
                            setTimeout(() => {
                                deleteText(() => {
                                    typeWriter("Eager to learn the locations my little anarchy?", 0, () => {
                                        setTimeout(() => {
                                            showChoicePrompt();
                                        }, 1200);
                                    });
                                });
                            }, 3000);
                        });
                    });
                }, 3000);
            });
        }

        function showChoicePrompt() {
            typeWriter("Care to play a game with me?", 0, () => {
                document.getElementById("choiceArea").classList.remove("hidden");
                document.getElementById("choiceArea").classList.add("flex");
            });
        }

        function handleChoice(choice) {
            document.getElementById("choiceArea").classList.remove("flex");
            document.getElementById("choiceArea").classList.add("hidden");

            if (choice !== "yes") {
                playBombBeep();
                setTimeout(() => triggerExplosion("assets/explosion1.mp4"), 300);
            } else {
                typeWriter("??????????????????????????????", 0, () => {
                    setTimeout(() => {
                        startRiddles();
                    }, 1500);
                });
            }
        }

        function triggerExplosion(videoPath) {
            document.getElementById("bodyTheme").style.backgroundColor = "#150000";
            let container = document.getElementById("gameContainer");
            container.classList.remove("terminal-border-green");
            container.classList.add("terminal-border-red");
            document.getElementById("textOutput").classList.remove("glow-green");
            document.getElementById("textOutput").classList.add("glow-red");

            let modal = document.getElementById("bombModal");
            modal.classList.remove("hidden");
            
            let vid = document.getElementById("explosionVideo");
            let fallback = document.getElementById("videoFallback");
            
            vid.src = videoPath;
            vid.load();
            
            vid.play().then(() => {
                fallback.classList.add("hidden");
            }).catch(e => {
                fallback.classList.remove("hidden");
            });

            vid.onended = () => {
                location.reload();
            };

            setTimeout(() => {
                location.reload();
            }, 5000);
        }

        function startRiddles() {
            loadNextRiddle();
        }

        function loadNextRiddle() {
            if (riddleIndex < riddles.length) {
                let current = riddles[riddleIndex];
                typeWriter(current.q, 0, () => {
                    document.getElementById("inputArea").classList.remove("hidden");
                    document.getElementById("inputArea").classList.add("flex");
                    document.getElementById("userInput").value = "";
                    document.getElementById("userInput").focus();
                });
            } else {
                triggerSuccessGlitchSequence();
            }
        }

        
        function triggerSuccessGlitchSequence() {
            let container = document.getElementById("gameContainer");
            container.classList.add("glitch-active");
            document.getElementById("bodyTheme").style.backgroundColor = "#1a0005";

            typeWriter("GO0D LuCK PrOTEcTiNG ThIS FILtH...                 TIK TOK BATMAN...                TIK   TOK.", 0, () => {
                let glitchTimer = setInterval(() => {
                    playKeySound();
                }, 50);

                setTimeout(() => {
                    clearInterval(glitchTimer);
                    container.style.opacity = '0';
                    document.body.style.backgroundColor = '#000000';
                    setTimeout(() => {
                        document.body.innerHTML = '<div style="color:red; font-family:\'Share Tech Mono\', monospace; font-size: 2rem; display:flex; height:100vh; align-items:center; justify-content:center; text-shadow: 0 0 20px red;">[ CONNECTION LOST: SIGNAL TERMINATED BY BATMAN ]</div>';
                    }, 1000);
                }, 3500);
            });
        }

        function handleUserSubmit() {
            if (isTyping) return;
            let inputVal = document.getElementById("userInput").value.trim().toLowerCase();
            if (!inputVal) return;

            document.getElementById("inputArea").classList.remove("flex");
            document.getElementById("inputArea").classList.add("hidden");

            let current = riddles[riddleIndex];

            if (inputVal === current.answer) {
                typeWriter(current.successMsg, 0, () => {
                    riddleIndex++;
                    setTimeout(() => {
                        loadNextRiddle();
                    }, 2800);
                });
            } else {
                playBombBeep();
                typeWriter("So this is your gift to gotham?                  this is you saving them?", 0, () => {
                    setTimeout(() => {
                        triggerExplosion(current.video);
                    }, 1200);
                });
            }
        }

        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                handleUserSubmit();
            }
        });
    </script>
</body>
</html>
